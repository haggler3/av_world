# Publish docs/ to the gh-pages branch (GitHub Pages serves it) and check that the live site and its files load.
name: site

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: docs/ -> gh-pages
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git subtree split --prefix docs -b gh-pages-new
          git push -f origin gh-pages-new:gh-pages

  check:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: The live site and its files load
        run: |
          base=https://haggler3.github.io/av_world
          sleep 90  # the Pages deployment that the push to gh-pages starts
          for p in "" index.html viewer/index.html viewer/viewer.js viewer/viewer.css viewer/data/index.json \
                   viewer/data/oakland/map.json viewer/data/oakland_learned.json viewer/data/oakland_learned.bin \
                   img/avbench.png img/wm_planner_junction.gif img/avlab_overview.png img/xnet_learned_avs.gif; do
            ok=""
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -o /tmp/f -w '%{http_code}' "$base/$p")
              if [ "$code" = "200" ] && [ -s /tmp/f ]; then ok=1; break; fi
              sleep 20
            done
            echo "$code $(stat -c %s /tmp/f) $base/$p"
            [ -n "$ok" ] || { echo "FAILED: $base/$p"; exit 1; }
          done
          grep -q "Driving worlds that" <(curl -s "$base/")
          echo "site OK: $base/"
